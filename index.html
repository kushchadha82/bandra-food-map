<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exhaustive Bandra, Khar & Santacruz Food Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; }
    header {
      background: #0f172a; color: #fff; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 8px; z-index: 1000;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    header h1 { font-size: 1rem; font-weight: 600; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    select, input, button {
      padding: 6px 10px; border-radius: 6px; border: none; font-size: 0.85rem;
    }
    input { flex: 1; min-width: 130px; }
    button {
      background: #2563eb; color: #fff; font-weight: 600; cursor: pointer;
    }
    button:disabled { background: #64748b; }
    #status { font-size: 0.78rem; color: #94a3b8; }
    #map { flex: 1; width: 100%; }
    .popup-title { font-weight: 700; font-size: 0.98rem; color: #0f172a; margin-bottom: 4px; }
    .popup-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; margin-bottom: 5px; text-transform: capitalize; }
    .popup-detail { font-size: 0.82rem; color: #475569; margin-bottom: 4px; }
    .popup-link { display: inline-block; margin-top: 6px; font-size: 0.82rem; color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <h1>🍽️ Bandra • Khar • Santacruz (All Eateries)</h1>
      <span id="status">Loading...</span>
    </div>
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search name or cuisine..." />
      <select id="typeFilter">
        <option value="ALL">All Types</option>
        <option value="restaurant">Restaurants</option>
        <option value="cafe">Cafés & Bakeries</option>
        <option value="fast_food">Fast Food & Street Food</option>
        <option value="bar">Bars & Pubs</option>
      </select>
      <button id="refreshBtn" onclick="fetchAllPlaces()">🔄 Scan Area</button>
    </div>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Centered covering Bandra West/East, Khar West/East, and Santacruz West/East
    const map = L.map("map").setView([19.0680, 72.8380], 14);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);
    let allPlaces = [];

    function formatCuisine(tags) {
      if (tags.cuisine) {
        return tags.cuisine.replace(/;/g, ", ").replace(/_/g, " ");
      }
      const amenityMap = {
        restaurant: "Multi-Cuisine / Restaurant",
        cafe: "Café & Coffee",
        fast_food: "Quick Bites / Street Food",
        bakery: "Bakery & Confectionery",
        bar: "Bar & Lounge",
        pub: "Pub & Gastropub",
        ice_cream: "Desserts & Ice Cream"
      };
      return amenityMap[tags.amenity] || amenityMap[tags.shop] || "Eatery";
    }

    function getCategory(tags) {
      if (tags.amenity === "cafe" || tags.shop === "bakery" || tags.amenity === "ice_cream") return "cafe";
      if (tags.amenity === "fast_food") return "fast_food";
      if (tags.amenity === "bar" || tags.amenity === "pub") return "bar";
      return "restaurant";
    }

    async function fetchAllPlaces() {
      const btn = document.getElementById("refreshBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.textContent = "Fetching live data...";

      // Bounding box covering Bandra (West & East), Khar (West & East), Santacruz (West & East), and BKC
      // South: 19.0420, West: 72.8180, North: 19.0920, East: 72.8720
      const bbox = "19.0420,72.8180,19.0920,72.8720";
      const query = `
        [out:json][timeout:25];
        (
          node["amenity"~"restaurant|cafe|fast_food|bar|pub|ice_cream"](${bbox});
          way["amenity"~"restaurant|cafe|fast_food|bar|pub|ice_cream"](${bbox});
          node["shop"="bakery"](${bbox});
          way["shop"="bakery"](${bbox});
        );
        out center;
      `;

      try {
        const response = await fetch("https://overpass-api.de/api/interpreter", {
          method: "POST",
          body: "data=" + encodeURIComponent(query)
        });
        const data = await response.json();

        allPlaces = data.elements
          .filter(el => el.tags && el.tags.name)
          .map(el => {
            const lat = el.lat || (el.center && el.center.lat);
            const lng = el.lon || (el.center && el.center.lon);
            return {
              name: el.tags.name,
              cuisine: formatCuisine(el.tags),
              category: getCategory(el.tags),
              street: el.tags["addr:street"] || el.tags["addr:suburb"] || "Bandra–Khar–Santacruz",
              lat,
              lng
            };
          })
          .filter(p => p.lat && p.lng);

        renderMarkers();
      } catch (err) {
        status.textContent = "Network error — tap Scan Area to retry";
      } finally {
        btn.disabled = false;
      }
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const selectedType = document.getElementById("typeFilter").value;
      const query = document.getElementById("searchBox").value.toLowerCase();

      const filtered = allPlaces
        .filter(p => selectedType === "ALL" || p.category === selectedType)
        .filter(p => p.name.toLowerCase().includes(query) || p.cuisine.toLowerCase().includes(query) || p.street.toLowerCase().includes(query));

      document.getElementById("status").textContent = `${filtered.length} places shown`;

      filtered.forEach(p => {
        const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + " Mumbai")}`;
        const popupHtml = `
          <div class="popup-title">${p.name}</div>
          <div class="popup-badge">${p.cuisine}</div>
          <div class="popup-detail">📍 ${p.street}</div>
          <a class="popup-link" href="${gmapsUrl}" target="_blank">Open in Google Maps / Street View →</a>
        `;
        L.circleMarker([p.lat, p.lng], {
          radius: 7,
          fillColor: p.category === "cafe" ? "#d97706" : p.category === "fast_food" ? "#16a34a" : p.category === "bar" ? "#9333ea" : "#2563eb",
          color: "#ffffff",
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        }).bindPopup(popupHtml).addTo(markersLayer);
      });
    }

    document.getElementById("typeFilter").addEventListener("change", renderMarkers);
    document.getElementById("searchBox").addEventListener("input", renderMarkers);

    // Automatically fetch all mapped restaurants on load
    fetchAllPlaces();
  </script>
</body>
</html>
